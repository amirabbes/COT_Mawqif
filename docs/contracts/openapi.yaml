openapi: 3.1.0
info:
  title: Mawqif — API REST
  version: 1.0.0
  description: |
    Contrat REST du backend Jakarta EE (WildFly).
    URL de base en local : `http://localhost:8081/api/v1`
    (WildFly publie `api.war` sous `/api`, l'application JAX-RS sous `/v1`).

    Conventions
    - Dates : ISO-8601 UTC (`2026-11-10T08:30:00Z`).
    - Identifiants : chaînes (ex. `parking-1`, `parking-1:07`, UUIDv7 pour les alertes).
    - Erreurs : `application/problem+json` (RFC 9457).
    - Concurrence : les ressources modifiables renvoient un en-tête `ETag` ; les
      modifications exigent `If-Match`.
    - Règle de sécurité : seul le backend commande la barrière. L'IA n'a aucune route d'écriture.
servers:
  - url: http://localhost:8081/api/v1
    description: Développement local (docker compose)
tags:
  - name: parkings
  - name: things
  - name: alerts
  - name: reservations
  - name: system
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [system]
      summary: État du service
      security: []
      responses:
        "200":
          description: Service en marche
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [UP] }
  /parkings:
    get:
      tags: [parkings]
      summary: Liste des parkings avec leurs compteurs
      description: Rôles `driver` et `operator`.
      responses:
        "200":
          description: Liste des parkings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Parking" }
        "401": { $ref: "#/components/responses/Problem" }
  /parkings/{parkingId}:
    get:
      tags: [parkings]
      summary: Détail d'un parking
      parameters:
        - $ref: "#/components/parameters/ParkingId"
      responses:
        "200":
          description: Le parking
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parking" }
        "404": { $ref: "#/components/responses/Problem" }
  /parkings/{parkingId}/slots:
    get:
      tags: [parkings]
      summary: Places d'un parking
      parameters:
        - $ref: "#/components/parameters/ParkingId"
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/SlotState" }
      responses:
        "200":
          description: Les places
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slot" }
        "404": { $ref: "#/components/responses/Problem" }
  /parkings/{parkingId}/barrier/open:
    post:
      tags: [parkings]
      summary: Ouverture manuelle de la barrière (opérateur)
      description: |
        Rôle `operator` uniquement. Le backend crée une commande signée et la publie
        sur `things/<barrière>/cmd` (voir contrat MQTT). Réponse asynchrone : `202`.
        Le résultat arrive par WebSocket (`command_ack`).
      parameters:
        - $ref: "#/components/parameters/ParkingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenBarrierRequest" }
      responses:
        "202":
          description: Commande acceptée et envoyée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /things:
    get:
      tags: [things]
      summary: Objets connectés (caméras, capteurs, barrière, passerelle)
      parameters:
        - name: parkingId
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ThingState" }
      responses:
        "200":
          description: Les objets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Thing" }
  /things/{thingId}:
    get:
      tags: [things]
      summary: Détail d'un objet
      parameters:
        - $ref: "#/components/parameters/ThingId"
      responses:
        "200":
          description: L'objet
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thing" }
        "404": { $ref: "#/components/responses/Problem" }
  /alerts:
    get:
      tags: [alerts]
      summary: Alertes (plus récentes d'abord)
      description: Rôle `operator`.
      parameters:
        - name: parkingId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AlertStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Les alertes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }
  /alerts/{alertId}/acknowledge:
    post:
      tags: [alerts]
      summary: Prendre en compte une alerte
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Alerte mise à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/Problem" }
  /reservations:
    get:
      tags: [reservations]
      summary: Mes réservations
      responses:
        "200":
          description: Réservations de l'utilisateur connecté
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reservation" }
    post:
      tags: [reservations]
      summary: Réserver une place
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReservationRequest" }
      responses:
        "201":
          description: Réservation créée
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "409": { $ref: "#/components/responses/Problem" }
  /reservations/{reservationId}:
    delete:
      tags: [reservations]
      summary: Annuler une réservation
      parameters:
        - name: reservationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Annulée }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton OIDC émis par Keycloak (rôles `driver`, `operator`).
  parameters:
    ParkingId:
      name: parkingId
      in: path
      required: true
      schema: { type: string, examples: [parking-1] }
    ThingId:
      name: thingId
      in: path
      required: true
      schema: { type: string, examples: [camera-entree] }
  headers:
    ETag:
      description: Version de la ressource (CRC-32C, voir `ETagSupport`).
      schema: { type: string }
  responses:
    Problem:
      description: Erreur (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    SlotState:
      type: string
      enum: [free, occupied, reserved]
    ThingState:
      type: string
      enum: [online, offline]
    ThingType:
      type: string
      enum: [camera, distance_sensor, barrier, gateway]
    AlertType:
      type: string
      enum: [parking_full, wrong_parking, plate_refused, thing_offline]
    AlertStatus:
      type: string
      enum: [open, acknowledged]
    CommandStatus:
      type: string
      enum: [sent, executed, rejected, expired]
    Parking:
      type: object
      required: [id, name, totalSlots, freeSlots, barrierState]
      properties:
        id: { type: string, examples: [parking-1] }
        name: { type: string }
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        totalSlots: { type: integer, minimum: 0 }
        freeSlots: { type: integer, minimum: 0 }
        barrierState: { type: string, enum: [open, closed, unknown] }
        updatedAt: { type: [string, "null"], format: date-time }
    Slot:
      type: object
      required: [id, parkingId, number, state]
      properties:
        id: { type: string, examples: ["parking-1:07"] }
        parkingId: { type: string }
        number: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/SlotState" }
        plate: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    Thing:
      type: object
      required: [id, type, state]
      properties:
        id: { type: string, examples: [camera-entree] }
        type: { $ref: "#/components/schemas/ThingType" }
        parkingId: { type: [string, "null"] }
        state: { $ref: "#/components/schemas/ThingState" }
        lastSeen: { type: [string, "null"], format: date-time }
        lastDatum:
          type: [string, "null"]
          description: Dernier message `datum` reçu, tel quel (JSON sérialisé, voir contrat MQTT).
    Alert:
      type: object
      required: [id, parkingId, type, status, createdAt]
      properties:
        id: { type: string }
        parkingId: { type: string }
        type: { $ref: "#/components/schemas/AlertType" }
        status: { $ref: "#/components/schemas/AlertStatus" }
        slot: { type: [integer, "null"] }
        plate: { type: [string, "null"] }
        message: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, "null"], format: date-time }
    OpenBarrierRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }
    Command:
      type: object
      required: [id, thingId, command, status, issuedAt]
      properties:
        id: { type: string }
        thingId: { type: string }
        command: { type: string, enum: [open_barrier] }
        status: { $ref: "#/components/schemas/CommandStatus" }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CreateReservationRequest:
      type: object
      required: [parkingId, plate, from, to]
      properties:
        parkingId: { type: string }
        plate: { type: string, examples: ["123 TUN 4567"] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    Reservation:
      type: object
      required: [id, parkingId, plate, from, to, status]
      properties:
        id: { type: string }
        parkingId: { type: string }
        plate: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        status: { type: string, enum: [active, used, cancelled, expired] }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
