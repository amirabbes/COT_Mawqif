openapi: 3.1.0
info:
  title: Mawqif — API REST
  version: 1.0.0
  description: |
    Contrat REST du backend Jakarta EE (WildFly).
    URL de base en local : `http://localhost:8081/api/v1`
    (WildFly publie `api-1.0.war` sous `/api`, l'application JAX-RS sous `/v1`).
    Avec les hôtes virtuels de l'enseignant (docker-compose.hosts.yml) l'API est à la racine de son propre
    domaine : `http://api.mawqif.local:8081/v1`.

    Les routes du tag `auth` (`/auth/*`, `/identities`) sont servies par le service IAM (`iam-1.0.war`),
    pas par l'API : `http://localhost:8081/iam/v1` en développement, `http://iam.mawqif.local:8081/v1` avec les hôtes virtuels.
    Le jeton qu'il émet est vérifié par l'API (clé HMAC partagée).

    Conventions
    - Dates : ISO-8601 UTC (`2026-11-10T08:30:00Z`).
    - Identifiants : chaînes (ex. `parking-1`, `parking-1:07`, UUIDv7 pour les alertes).
    - Erreurs : `application/problem+json` (RFC 9457).
    - Concurrence : les ressources modifiables renvoient un en-tête `ETag` ; les
      modifications exigent `If-Match`.
    - Règle de sécurité : seul le backend commande la barrière. L'IA n'a aucune route d'écriture.
servers:
  - url: http://localhost:8081/api/v1
    description: Développement local (docker compose)
tags:
  - name: auth
  - name: parkings
  - name: things
  - name: alerts
  - name: reservations
  - name: system
security:
  - bearerAuth: []
paths:
  /auth/token:
    servers:
      - url: http://localhost:8081/iam/v1
        description: "Service IAM (iam-1.0.war). Avec les hôtes virtuels : http://iam.mawqif.local:8081/v1"
    post:
      tags: [auth]
      summary: Connexion (OAuth 2.0 — grant `password` ou `refresh_token`)
      description: |
        Public. `client_id` = `driver-app` ou `admin-app` ; un compte ne peut se connecter
        qu'avec un client qui accepte son rôle. Les champs suivent la RFC 6749.
        Le jeton d'accès dure 15 min, le jeton de rafraîchissement 7 jours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Jetons émis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /auth/register:
    servers:
      - url: http://localhost:8081/iam/v1
        description: "Service IAM (iam-1.0.war). Avec les hôtes virtuels : http://iam.mawqif.local:8081/v1"
    post:
      tags: [auth]
      summary: Inscription d'un automobiliste (rôle `driver` uniquement)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /auth/me:
    servers:
      - url: http://localhost:8081/iam/v1
        description: "Service IAM (iam-1.0.war). Avec les hôtes virtuels : http://iam.mawqif.local:8081/v1"
    get:
      tags: [auth]
      summary: Compte lié au jeton
      responses:
        "200":
          description: Informations du jeton
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  username: { type: string }
                  roles: { type: array, items: { type: string, enum: [DRIVER, OPERATOR, ADMIN] } }
                  scope: { type: string }
                  client_id: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
  /identities:
    servers:
      - url: http://localhost:8081/iam/v1
        description: "Service IAM (iam-1.0.war). Avec les hôtes virtuels : http://iam.mawqif.local:8081/v1"
    get:
      tags: [auth]
      summary: Liste des comptes
      description: Rôle `ADMIN`, scope `iam:manage`.
      responses:
        "200":
          description: Comptes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [auth]
      summary: Création d'un compte (opérateur, admin…)
      description: Rôle `ADMIN`, scope `iam:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIdentityRequest" }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /health:
    get:
      tags: [system]
      summary: État du service
      security: []
      responses:
        "200":
          description: Service en marche
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [UP] }
  /parkings:
    get:
      security: []
      tags: [parkings]
      summary: Liste des parkings avec leurs compteurs
      description: Public (aucun jeton requis).
      responses:
        "200":
          description: Liste des parkings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Parking" }
        "401": { $ref: "#/components/responses/Problem" }
  /parkings/{parkingId}:
    get:
      security: []
      tags: [parkings]
      summary: Détail d'un parking
      parameters:
        - $ref: "#/components/parameters/ParkingId"
      responses:
        "200":
          description: Le parking
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parking" }
        "404": { $ref: "#/components/responses/Problem" }
  /parkings/{parkingId}/slots:
    get:
      security: []
      tags: [parkings]
      summary: Places d'un parking
      parameters:
        - $ref: "#/components/parameters/ParkingId"
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/SlotState" }
      responses:
        "200":
          description: Les places
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slot" }
        "404": { $ref: "#/components/responses/Problem" }
  /parkings/{parkingId}/barrier/open:
    post:
      tags: [parkings]
      summary: Ouverture manuelle de la barrière (opérateur)
      description: |
        Rôle `operator` uniquement. Le backend crée une commande signée et la publie
        sur `things/<barrière>/cmd` (voir contrat MQTT). Réponse asynchrone : `202`.
        Le résultat arrive par WebSocket (`command_ack`).
      parameters:
        - $ref: "#/components/parameters/ParkingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenBarrierRequest" }
      responses:
        "202":
          description: Commande acceptée et envoyée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /things:
    get:
      tags: [things]
      summary: Objets connectés (caméras, capteurs, barrière, passerelle)
      parameters:
        - name: parkingId
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ThingState" }
      responses:
        "200":
          description: Les objets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Thing" }
  /things/{thingId}:
    get:
      tags: [things]
      summary: Détail d'un objet
      parameters:
        - $ref: "#/components/parameters/ThingId"
      responses:
        "200":
          description: L'objet
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thing" }
        "404": { $ref: "#/components/responses/Problem" }
  /alerts:
    get:
      tags: [alerts]
      summary: Alertes (plus récentes d'abord)
      description: Rôle `operator`.
      parameters:
        - name: parkingId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AlertStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Les alertes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }
  /alerts/{alertId}/acknowledge:
    post:
      tags: [alerts]
      summary: Prendre en compte une alerte
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Alerte mise à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "404": { $ref: "#/components/responses/Problem" }
  /reservations:
    get:
      tags: [reservations]
      summary: Réservations
      description: |
        Un automobiliste (`DRIVER`) voit les siennes ; l'exploitant (`OPERATOR`, `ADMIN`) voit toutes
        les réservations (filtre facultatif `parkingId`). Les réservations terminées passent à `expired`.
      parameters:
        - name: parkingId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Liste, la plus récente d'abord
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [reservations]
      summary: Réserver une place
      description: |
        Règles : fin après début et dans le futur, durée de 24 h au plus, début dans les 30 jours,
        plaque de 3 à 20 caractères (lettres, chiffres, espace, tiret), au plus 5 réservations actives
        par compte. Refus `409` si le parking est complet sur la période ou si la plaque a déjà une
        réservation qui chevauche.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReservationRequest" }
      responses:
        "201":
          description: Réservation créée
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /reservations/{reservationId}:
    delete:
      tags: [reservations]
      summary: Annuler une réservation active
      description: Le propriétaire ou l'exploitant. Pour un autre automobiliste, la réponse est `404`.
      parameters:
        - name: reservationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Annulée }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT émis par `POST /auth/token` (rôles `DRIVER`, `OPERATOR`, `ADMIN`).
        À terme remplaçable par Keycloak (OIDC) sans changer les PWA.
  parameters:
    ParkingId:
      name: parkingId
      in: path
      required: true
      schema: { type: string, examples: [parking-1] }
    ThingId:
      name: thingId
      in: path
      required: true
      schema: { type: string, examples: [camera-entree] }
  headers:
    ETag:
      description: Version de la ressource (CRC-32C, voir `ETagSupport`).
      schema: { type: string }
  responses:
    Problem:
      description: Erreur (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type: { type: string, enum: [password, refresh_token] }
        client_id: { type: string, examples: [driver-app] }
        client_secret: { type: string, description: "Seulement pour un client confidentiel." }
        username: { type: string }
        password: { type: string }
        refresh_token: { type: string }
        scope: { type: string, description: "Facultatif ; réduit aux scopes autorisés pour le compte et le client." }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: secondes }
        refresh_token: { type: string }
        scope: { type: string }
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: "^[a-z0-9._@-]{3,50}$" }
        password: { type: string, minLength: 8, maxLength: 128 }
    CreateIdentityRequest:
      type: object
      required: [username, password, roles]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }
        roles: { type: array, items: { type: string, enum: [DRIVER, OPERATOR, ADMIN] } }
    Identity:
      type: object
      required: [id, username, roles]
      properties:
        id: { type: string }
        username: { type: string }
        roles: { type: array, items: { type: string, enum: [DRIVER, OPERATOR, ADMIN] } }
        scope: { type: string }
        createdAt: { type: string, format: date-time }
    SlotState:
      type: string
      enum: [free, occupied, reserved]
    ThingState:
      type: string
      enum: [online, offline]
    ThingType:
      type: string
      enum: [camera, distance_sensor, barrier, gateway]
    AlertType:
      type: string
      enum: [parking_full, wrong_parking, plate_refused, thing_offline]
    AlertStatus:
      type: string
      enum: [open, acknowledged]
    CommandStatus:
      type: string
      enum: [sent, executed, rejected, expired]
    Parking:
      type: object
      required: [id, name, totalSlots, freeSlots, barrierState]
      properties:
        id: { type: string, examples: [parking-1] }
        name: { type: string }
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        totalSlots: { type: integer, minimum: 0 }
        freeSlots: { type: integer, minimum: 0 }
        barrierState: { type: string, enum: [open, closed, unknown] }
        updatedAt: { type: [string, "null"], format: date-time }
    Slot:
      type: object
      required: [id, parkingId, number, state]
      properties:
        id: { type: string, examples: ["parking-1:07"] }
        parkingId: { type: string }
        number: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/SlotState" }
        plate: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    Thing:
      type: object
      required: [id, type, state]
      properties:
        id: { type: string, examples: [camera-entree] }
        type: { $ref: "#/components/schemas/ThingType" }
        parkingId: { type: [string, "null"] }
        state: { $ref: "#/components/schemas/ThingState" }
        lastSeen: { type: [string, "null"], format: date-time }
        lastDatum:
          type: [string, "null"]
          description: Dernier message `datum` reçu, tel quel (JSON sérialisé, voir contrat MQTT).
    Alert:
      type: object
      required: [id, parkingId, type, status, createdAt]
      properties:
        id: { type: string }
        parkingId: { type: string }
        type: { $ref: "#/components/schemas/AlertType" }
        status: { $ref: "#/components/schemas/AlertStatus" }
        slot: { type: [integer, "null"] }
        plate: { type: [string, "null"] }
        message: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, "null"], format: date-time }
    OpenBarrierRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }
    Command:
      type: object
      required: [id, thingId, command, status, issuedAt]
      properties:
        id: { type: string }
        thingId: { type: string }
        command: { type: string, enum: [open_barrier] }
        status: { $ref: "#/components/schemas/CommandStatus" }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CreateReservationRequest:
      type: object
      required: [parkingId, plate, from, to]
      properties:
        parkingId: { type: string }
        plate: { type: string, examples: ["123 TUN 4567"] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    Reservation:
      type: object
      required: [id, parkingId, plate, from, to, status]
      properties:
        id: { type: string }
        parkingId: { type: string }
        plate: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        status: { type: string, enum: [active, used, cancelled, expired] }
        owner: { type: string, description: Nom du compte qui a réservé }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
