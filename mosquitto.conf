# Configuration Mosquitto - DÉVELOPPEMENT LOCAL SEULEMENT
# Même principe que le backend du prof : TLS 1.3 + identifiant/mot de passe.

# Chaque "listener" a ses propres règles
per_listener_settings true

# Port 1882 : MQTT sécurisé (TLS 1.3) -> utilisé par le backend Jakarta
listener 1882
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.3
allow_anonymous false
password_file /mosquitto/config/passwd

# Port 1883 : MQTT sans TLS, mais avec mot de passe -> pour Node-RED et le simulateur en local
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
