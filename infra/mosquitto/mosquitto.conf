# Mosquitto config - LOCAL DEVELOPMENT ONLY
per_listener_settings true

# Port 1882: secure MQTT (TLS 1.3), used by the Jakarta backend
listener 1882
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.3
allow_anonymous false
password_file /mosquitto/config/passwd

# Port 1883: plain MQTT with password, for Node-RED and the simulator
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
