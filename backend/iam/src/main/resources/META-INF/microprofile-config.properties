# --- Service IAM (iam-1.0.war) ---
# MongoDB (docker-compose remplace l'URI par la variable JNOSQL_MONGODB_URL). Base propre au service : iam.database.
jnosql.mongodb.url=mongodb://localhost:27017/iam_db?uuidRepresentation=standard&minPoolSize=2&maxPoolSize=20
iam.database=iam_db

# false = l'API n'exige plus de jeton (variable IAM_ENABLED, lue aussi par api-1.0.war)
iam.enabled=true
# Clé de signature des JWT (variable IAM_JWT_SECRET) : DOIT être identique dans iam-1.0.war et api-1.0.war. 32 caractères ou plus.
iam.jwt.secret=dev-only-change-me-iam-secret-0123456789
iam.jwt.issuer=mawqif
iam.access.ttl.seconds=900
iam.refresh.ttl.seconds=604800

# Comptes et clients de test créés au démarrage (mawqif.seed.enabled=true) : DÉVELOPPEMENT seulement
mawqif.seed.enabled=true
iam.seed.admin.password=admin12345
iam.seed.operator.password=operator12345
iam.seed.driver.password=driver12345

# Origines autorisées pour les PWA (variable CORS_ALLOWED_ORIGINS) et interrupteur (CORS_ENABLED)
cors.allowed.origins=http://localhost:5173,http://localhost:5174
cors.enabled=true
