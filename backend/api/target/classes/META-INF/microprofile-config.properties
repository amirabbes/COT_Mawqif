# --- Du prof (cot.zip) : MongoDB via Jakarta NoSQL ---
jnosql.document=document
jnosql.document.database=cot_db
jnosql.mongodb.url=mongodb://localhost:27017/cot_db?uuidRepresentation=standard&minPoolSize=10&maxPoolSize=120
document.provider=org.eclipse.jnosql.databases.mongodb.communication.MongoDBDocumentConfiguration

# --- Du prof : broker MQTT (docker-compose remplace ces valeurs par des variables d'environnement) ---
mqtt.broker.url=ssl://localhost:1882
mqtt.client.id=cot-middleware

# --- Mawqif ---
# Clé HMAC des commandes de barrière (variable d'environnement COMMAND_SIGNING_KEY). À CHANGER hors développement.
command.signing.key=dev-only-change-me
# Origines autorisées pour les PWA (variable CORS_ALLOWED_ORIGINS)
cors.allowed.origins=http://localhost:5173,http://localhost:5174
# Données de départ (parking-1 avec 10 places) ; mettre false pour désactiver
mawqif.seed.enabled=true
mawqif.seed.slots=10
