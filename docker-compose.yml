# Mawqif - environnement de développement LOCAL
#
# Première fois (une seule fois) :
#   1. cp .env.example .env          (puis changez les mots de passe)
#   2. bash infra/setup-dev.sh       (certificats TLS)
#
# Ensuite :
#   docker compose up -d                          # compile l'API, puis MongoDB + MQTT + WildFly (mode développement)
#   docker compose -f docker-compose.yml -f docker-compose.hosts.yml up -d   # mode « WildFly sert tout » (scripts .cli de l'enseignant)
#   docker compose --profile gateway up -d        # + Node-RED
#   docker compose down                           # arrêter
#   docker compose down -v                        # tout effacer (données comprises)

services:

  # ---------- Base de données ----------
  # Une seule instance : le backend Jakarta utilise la base "cot_db",
  # l'exemple Node.js utilise "wot_db".
  mongodb:
    image: mongo:7
    container_name: mawqif-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Broker MQTT ----------
  # Le backend du prof se connecte en TLS 1.3 avec identifiant + mot de passe
  # (mqtts, port 1882). On reproduit la même chose ici.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mawqif-mosquitto
    restart: unless-stopped
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    # Mosquitto 2.1 refuse un fichier de mots de passe monté depuis Windows (droits trop ouverts).
    # On le crée donc DANS le conteneur au démarrage, et on le donne à l'utilisateur
    # "mosquitto" (c'est lui qui lit le fichier) avec des droits stricts (600).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rm -f /mosquitto/config/passwd && mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USER" "$$MQTT_PASSWORD" && chown mosquitto:mosquitto /mosquitto/config/passwd && chmod 600 /mosquitto/config/passwd && exec /docker-entrypoint.sh mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1882:1882"   # MQTT sécurisé (TLS 1.3) : utilisé par le backend
      - "1883:1883"   # MQTT simple (avec mot de passe) : pour tester en local (Node-RED, simulateur)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./infra/certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./infra/certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto_data:/mosquitto/data

  # ---------- Compilation du backend (une seule fois à chaque "docker compose up") ----------
  # Remplace les deux commandes manuelles : mvn clean package, puis copie de api-1.0.war et iam-1.0.war dans backend/deployments.
  # Le cache Maven est gardé dans un volume : seul le premier lancement est long (téléchargements).
  api-builder:
    image: maven:3.9-eclipse-temurin-25
    container_name: mawqif-api-builder
    working_dir: /build
    # On compile une COPIE des sources : jamais de "mvn clean" sur le dossier Windows (verrous OneDrive/Windows),
    # et les dossiers target/ de votre dépôt ne sont plus modifiés.
    command:
      - sh
      - -c
      - cp -r /src/. /build/ && rm -rf /build/core/target /build/iam/target /build/api/target && mvn -q -B clean package && mkdir -p /deployments && rm -f /deployments/api.war /deployments/api.war.* && cp api/target/api-1.0.war iam/target/iam-1.0.war /deployments/
    volumes:
      - ./backend:/src:ro
      - ./backend/deployments:/deployments
      - maven_cache:/root/.m2

  # ---------- Backend : serveur d'applications Jakarta EE 11 ----------
  # Le projet du prof (cot.zip) est compilé avec Java 25 -> image jdk25.
  wildfly:
    image: quay.io/wildfly/wildfly:42.0.0.Final-jdk25
    container_name: mawqif-wildfly
    restart: unless-stopped
    command: ["/opt/jboss/wildfly/bin/standalone.sh", "-b", "0.0.0.0", "-bmanagement", "0.0.0.0"]
    environment:
      # Ces variables remplacent celles du fichier microprofile-config.properties
      # (MicroProfile Config : "mqtt.broker.url" devient MQTT_BROKER_URL).
      # Sans elles, le backend ne démarre pas : il lit ces valeurs au lancement.
      JNOSQL_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/cot_db?authSource=admin&uuidRepresentation=standard&minPoolSize=10&maxPoolSize=120
      MQTT_BROKER_URL: ssl://mosquitto:1882
      MQTT_CLIENT_ID: cot-middleware
      MQTT_BROKER_USERNAME: ${MQTT_USER}
      MQTT_BROKER_PASSWORD: ${MQTT_PASSWORD}
      MQTT_BROKER_TRUSTSTORE_PATH: /opt/certs/truststore.jks
      MQTT_BROKER_TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
      # IAM : clé de signature des JWT (32 caractères ou plus) et mots de passe des comptes de test.
      IAM_JWT_SECRET: ${IAM_JWT_SECRET:-dev-only-change-me-iam-secret-0123456789}
      IAM_SEED_ADMIN_PASSWORD: ${IAM_SEED_ADMIN_PASSWORD:-admin12345}
      IAM_SEED_OPERATOR_PASSWORD: ${IAM_SEED_OPERATOR_PASSWORD:-operator12345}
      IAM_SEED_DRIVER_PASSWORD: ${IAM_SEED_DRIVER_PASSWORD:-driver12345}
      # Origines autorisées pour les PWA. '*' = toutes (pratique sur un réseau local de développement).
      # Hors développement : liste exacte, ex. http://192.168.1.20:5173,http://192.168.1.20:5174
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8081:8080"   # application et API REST
      - "9990:9990"   # console d'administration
    volumes:
      # api-1.0.war et iam-1.0.war y sont déposés par le service api-builder : il est déployé automatiquement
      - ./backend/deployments:/opt/jboss/wildfly/standalone/deployments
      - ./infra/certs/truststore.jks:/opt/certs/truststore.jks:ro
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_started
      api-builder:
        condition: service_completed_successfully

  # ---------- Node-RED (optionnel, côté passerelle) ----------
  # Node-RED est un outil à part (éditeur visuel de flux), PAS le projet Node.js
  # du prof. Il sert pour les règles en périphérie (voir cahier des charges).
  # Dans Node-RED, le noeud MQTT se connecte à :  mosquitto : 1883
  # avec MQTT_USER / MQTT_PASSWORD.
  # Lancer avec :  docker compose --profile gateway up -d
  nodered:
    image: nodered/node-red:latest
    container_name: mawqif-nodered
    restart: unless-stopped
    profiles: ["gateway"]
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - mosquitto

  # ---------- Plus tard (à ajouter quand on en aura besoin) ----------
  # keycloak:   authentification OAuth 2.0 / OpenID Connect (semaine 6)
  # langfuse:   suivi de l'agent IA (semaine 6)
  # nginx:      TLS 1.3 devant le backend (semaine 6)

volumes:
  maven_cache:
  mongo_data:
  mosquitto_data:
  nodered_data: